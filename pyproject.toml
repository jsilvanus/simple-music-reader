[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-reader"
version = "0.1.0"
description = "Extract simple melodies from church sheet-music PDFs into a Music IR and ABC"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pypdfium2>=4.30",
  "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]

[project.scripts]
music-reader = "music_reader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests on generated PDFs",
  "real_pdf: optional tests on real PDFs found via MUSIC_READER_FIXTURES (skipped when unset)",
]
